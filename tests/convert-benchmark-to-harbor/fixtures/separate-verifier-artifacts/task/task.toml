schema_version = "1.3"

[task]
name = "fixture/report-summary"
description = "Summarize a CSV file; graded in a separate verifier container."

[metadata]
source_task_id = "report-summary/1"

[environment]
network_mode = "no-network"
workdir = "/app"

[agent]
timeout_sec = 300.0

[verifier]
timeout_sec = 120.0
environment_mode = "separate"

[verifier.environment]
network_mode = "no-network"
workdir = "/tests"

[[artifacts]]
source = "/app/report.json"
