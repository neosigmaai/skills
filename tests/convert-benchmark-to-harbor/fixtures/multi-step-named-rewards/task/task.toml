schema_version = "1.3"
multi_step_reward_strategy = "final"

[task]
name = "fixture/notes-two-turns"
description = "Two dependent turns with named per-turn metrics."

[metadata]
source_task_id = "notes/1"

[environment]
network_mode = "no-network"
workdir = "/app"

[[steps]]
name = "create"
min_reward = { file_exists = 1.0 }

[steps.agent]
timeout_sec = 120.0

[steps.verifier]
timeout_sec = 60.0

[[steps]]
name = "extend"

[steps.agent]
timeout_sec = 120.0

[steps.verifier]
timeout_sec = 60.0
